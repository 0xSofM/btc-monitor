name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Check user-facing copy
        run: python scripts/check_copy.py

      - name: Check generated model contract
        run: python scripts/generate_model_contract.py --check

      - name: Validate checked-in data quality
        run: |
          python validate_btc_data_quality.py \
            --current-history app/public/btc_indicators_history.json \
            --current-history-light app/public/btc_indicators_history_light.json \
            --current-latest app/public/btc_indicators_latest.json \
            --lookback-rows 30 \
            --max-row-drop 5 \
            --max-indicator-lag-days 21

      - name: Validate checked-in Strategy mNAV quality
        run: |
          python validate_strategy_mnav.py \
            --current-latest app/public/strategy_mnav_latest.json \
            --current-history app/public/strategy_mnav_history.json \
            --skip-freshness-check \
            --min-history-rows 250 \
            --max-mstr-lag-days 7 \
            --max-btc-lag-hours 36

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Audit dependencies
        working-directory: ./app
        run: npm run audit

      - name: Lint
        working-directory: ./app
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./app
        run: npm run test

      - name: Check Edge proxy syntax
        working-directory: ./app
        run: |
          node --check api/btc-data.js
          node --check api/btc-data-config.js
          node --check api/generated-model-contract.js

      - name: Build
        working-directory: ./app
        run: npm run build

      - name: Install browser for smoke test
        working-directory: ./app
        run: npx playwright install chromium --with-deps

      - name: Run browser smoke test
        working-directory: ./app
        run: |
          mkdir -p ../.tmp
          npm run preview -- --host 127.0.0.1 --port 4173 > ../.tmp/vite-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173
          npm run smoke
